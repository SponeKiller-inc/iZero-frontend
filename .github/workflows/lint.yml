name: Vite & React lint test

on:
  pull_request:  
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: app/src
        run: npm ci

      - name: Run ESLint
        run: npm run lint
